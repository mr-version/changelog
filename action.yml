name: 'Generate Changelog'
description: 'Generate changelogs from conventional commits using Mister.Version'
author: 'Mister.Version Team'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  repository-path:
    description: 'Path to the Git repository root'
    required: false
    default: '.'
  project-name:
    description: 'Project name for monorepo scenarios'
    required: false
  from-version:
    description: 'Start version tag (defaults to previous tag)'
    required: false
  to-version:
    description: 'End version tag (defaults to HEAD)'
    required: false
  output-format:
    description: 'Output format (markdown, text, json)'
    required: false
    default: 'markdown'
  output-file:
    description: 'Output file path (if not specified, outputs to console/summary)'
    required: false
  tag-prefix:
    description: 'Prefix for version tags'
    required: false
    default: 'v'
  repository-url:
    description: 'Repository URL for generating links (e.g., https://github.com/owner/repo)'
    required: false
  include-authors:
    description: 'Include commit authors in changelog'
    required: false
    default: 'false'
  include-commit-links:
    description: 'Include commit links'
    required: false
    default: 'true'
  include-issue-references:
    description: 'Include issue references'
    required: false
    default: 'true'
  include-pr-references:
    description: 'Include PR references'
    required: false
    default: 'true'
  group-breaking-changes:
    description: 'Group breaking changes separately'
    required: false
    default: 'true'
  config-file:
    description: 'Path to mr-version.yml configuration file (auto-detected if not specified)'
    required: false
  post-to-pr:
    description: 'Post the changelog as a PR comment (requires pull_request event)'
    required: false
    default: 'false'
  update-existing-comment:
    description: 'Update existing PR comment instead of creating new one'
    required: false
    default: 'true'
  comment-header:
    description: 'Header text for PR comments to identify them'
    required: false
    default: '## 📝 Changelog'
  token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}

outputs:
  changelog-content:
    description: 'The generated changelog content'
  changelog-file:
    description: 'Path to the generated changelog file (if output-file was specified)'
  version-range:
    description: 'Version range for the changelog (e.g., "v1.0.0...v1.1.0")'
  has-breaking-changes:
    description: 'Whether the changelog contains breaking changes'

runs:
  using: 'node24'
  main: 'dist/index.js'
